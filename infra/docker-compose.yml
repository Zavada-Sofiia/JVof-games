name: jvof-games
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jvof
      POSTGRES_PASSWORD: jvof
      POSTGRES_DB: jvof
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jvof"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
